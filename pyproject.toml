[project]
name = "shop-example"
version = "0.1.0"
description = "Минимальный FastAPI-сервис интернет-магазина для обучения"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.5",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "sqlalchemy[asyncio]>=2.0.36",
    "httpx>=0.27",
]

# Группа dev-зависимостей: ставится через `uv sync` (в отличие от `uv sync --no-dev`)
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
# Тесты с `async def` будут запускаться автоматически, без декоратора @pytest.mark.asyncio
asyncio_mode = "auto"
testpaths = ["tests"]
# Чтобы импортировать пакет app из корня проекта
pythonpath = ["."]

[tool.uv]
# Обычное приложение, а не библиотека: uv не будет собирать пакет
package = false
